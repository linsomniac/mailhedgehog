name: Frontend CI

on:
  push:
    paths:
      - "frontend/**"
      - "src/mailhedgehog/static/**"
  pull_request:
    paths:
      - "frontend/**"
      - "src/mailhedgehog/static/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (svelte-check)
        run: npm run check

      - name: Run tests (vitest)
        run: npm run test

      - name: Build
        run: npm run build

      - name: Verify committed build is in sync
        working-directory: ${{ github.workspace }}
        run: |
          if ! git diff --exit-code -- src/mailhedgehog/static/app; then
            echo ""
            echo "ERROR: The committed build output is out of sync with frontend/ source."
            echo "To fix, run the following commands and commit the result:"
            echo ""
            echo "    cd frontend && npm ci && npm run build"
            echo "    git add src/mailhedgehog/static/app"
            echo "    git commit -m 'chore(ui): rebuild committed static assets'"
            echo ""
            exit 1
          fi
